name: glitch_vpn_core
description: "Flutter FFI plugin for the libglitchcore VPN core: Xray (VLESS/Trojan/Shadowsocks), AmneziaWG and mihomo engines behind one Dart API."
version: 0.0.1
homepage: https://github.com/glitch-vpn/glitch_vpn_core_plugin

# Pinned core release for android/build.gradle and windows/CMakeLists.txt.
# libglitchcore_sha256 is optional (release zip); when set, downloads are verified.
libglitchcore_version: v0.1.0
libglitchcore_sha256: 27d49f0d4af4281baa525772931afbbffdaad2da9826fd705a253868fa228f21

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.1.0
  path_provider: ^2.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1

flutter:
  plugin:
    ffiPlugin: true
    platforms:
      android:
        package: com.glitch_vpn.core
        pluginClass: GlitchVpnCorePlugin
      ios:
        pluginClass: GlitchVpnCorePlugin
      linux:
        pluginClass: GlitchVpnCorePlugin
      macos:
        pluginClass: GlitchVpnCorePlugin
      windows:
        pluginClass: GlitchVpnCorePluginCApi
