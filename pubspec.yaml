name: glitch_vpn_core
description: "Flutter FFI plugin for the libglitchcore VPN core: Xray (VLESS/VMess/Trojan/Shadowsocks), AmneziaWG and mihomo (Hysteria2/TUIC/AnyTLS) engines behind one Dart API."
version: 0.2.3
homepage: https://github.com/glitch-vpn/glitch_vpn_core_plugin

# Pinned core release for android/build.gradle and windows/CMakeLists.txt.
# libglitchcore_sha256 is optional (release zip); when set, downloads are verified.
libglitchcore_version: v0.2.3
libglitchcore_sha256: ce19715a76d86a6b1232f4919587eb01b1d9501087420c57ec2e3ab75fe81de9

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1

flutter:
  plugin:
    ffiPlugin: true
    platforms:
      android:
        package: com.glitch_vpn.core
        pluginClass: GlitchVpnCorePlugin
      ios:
        pluginClass: GlitchVpnCorePlugin
      linux:
        pluginClass: GlitchVpnCorePlugin
      macos:
        pluginClass: GlitchVpnCorePlugin
      windows:
        pluginClass: GlitchVpnCorePluginCApi
